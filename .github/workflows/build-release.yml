name: Build Luna release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [both, windows, android]
        default: both

permissions:
  contents: read

jobs:
  windows:
    if: inputs.platform != 'android'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Test and build Windows
        working-directory: client
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Luna-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: luna-windows
          path: client/Luna-Windows.zip
          if-no-files-found: error

  android:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Install Android build tools
        run: |
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          mkdir -p "$sdk/cmdline-tools" "$RUNNER_TEMP/android-tools"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/luna"
          manager="$sdk/cmdline-tools/luna/bin/sdkmanager"
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          "$manager" --sdk_root="$sdk" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Test and build Android
        working-directory: client_android
        run: |
          flutter pub get --enforce-lockfile
          flutter test --no-pub
          flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: luna-android-staging
          path: client_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

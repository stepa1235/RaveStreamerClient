name: Build Luna release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Test and build Windows
        working-directory: client
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Luna-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: luna-windows
          path: client/Luna-Windows.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Test and build Android
        working-directory: client_android
        run: |
          flutter pub get --enforce-lockfile
          flutter test --no-pub
          flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: luna-android-staging
          path: client_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
